services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vdr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vdr}
      POSTGRES_DB: ${POSTGRES_DB:-vdr}
    volumes:
      - ./docker/init/:/docker-entrypoint-initdb.d/
      - db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vdr} -d ${POSTGRES_DB:-vdr}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-vdr}:${POSTGRES_PASSWORD:-vdr}@db:5432/${POSTGRES_DB:-vdr}?schema=public
      DATABASE_URL_TEST: postgresql://${POSTGRES_USER:-vdr}:${POSTGRES_PASSWORD:-vdr}@db:5432/vdr_test?schema=public
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    command: yarn workspace @vdr/api dev

volumes:
  db_data: