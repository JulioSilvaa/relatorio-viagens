name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cd-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: ${{ github.event.workflow_run == null || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - name: api
            context: .
            file: apps/api/Dockerfile
            image: relatorio-viagens-api
          - name: web
            context: .
            file: apps/web/Dockerfile
            image: relatorio-viagens-web
          - name: ocr
            context: .
            file: apps/ocr/Dockerfile
            image: relatorio-viagens-ocr
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/juliosilvaa/${{ matrix.image }}:latest
            ghcr.io/juliosilvaa/${{ matrix.image }}:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    if: ${{ github.event.workflow_run == null || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          ping: 100.96.239.45

      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' '${{ secrets.SSH_KEY }}' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s %s\n' '${{ secrets.SSH_HOST }}' '${{ secrets.SSH_KNOWN_HOSTS }}' > ~/.ssh/known_hosts

      - name: Enviar compose.prod.yml
        run: |
          ssh -i ~/.ssh/deploy_key '${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}' 'mkdir -p /opt/juliosilvaa'
          scp -i ~/.ssh/deploy_key compose.prod.yml '${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/juliosilvaa/compose.prod.yml'

      - name: Deploy no servidor
        run: |
          ssh -i ~/.ssh/deploy_key '${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}' "
            set -eu
            cd /opt/juliosilvaa
            printf '%s\n' '${{ secrets.GHCR_TOKEN }}' | docker login ghcr.io -u '${{ secrets.GHCR_USERNAME }}' --password-stdin
            IMAGE_TAG=${IMAGE_TAG} docker compose -f compose.prod.yml pull
            IMAGE_TAG=${IMAGE_TAG} docker compose -f compose.prod.yml run --rm api npx prisma migrate deploy --schema prisma/schema.prisma
            IMAGE_TAG=${IMAGE_TAG} docker compose -f compose.prod.yml up -d --remove-orphans
            docker image prune -f
          "